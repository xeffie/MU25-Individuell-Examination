<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmarks | Mini</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h9a3 3 0 0 1 3 3v14l-7.5-3.5L3 20V6a3 3 0 0 1 3-3z" />
          </svg>
          <span class="logo-name">Bookmarks Mini</span>
        </div>
        <p class="tagline">Save the web, one click at the time.</p>
      </div>
    </header>
    <main class="container">
      <section class="card">
        <h2 id="add-title" class="card-title">Add bookmark</h2>
        <form id="add-form" class="form" autocomplete="off">
          <div class="field">
            <label for="title">Title</label>
            <input
              id="title"
              name="title"
              type="text"
              placeholder="ex. MU25 Resources"
              required
            />
          </div>
          <div class="field">
            <label for="url">URL</label>
            <input
              id="url"
              name="url"
              type="url"
              inputmode="url"
              placeholder="https://example.com"
              required
            />
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit" disabled>Add</button>
          </div>
          <p
            id="form-error"
            class="form-error"
            role="alert"
            aria-live="polite"
          ></p>
        </form>
      </section>

      <section class="empty card" id="empty-state" aria-live="polite">
        <div class="empty-ill">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path
              d="M16 10h32a4 4 0 0 1 4 4v36L32 42 12 50V14a4 4 0 0 1 4-4z"
            />
          </svg>
        </div>
        <h3>Uh oh, no bookmarks yet. :(</h3>
        <p>Try adding your first link above. They’ll appear here.</p>
      </section>

      <section class="card" id="list-section" aria-live="polite" hidden>
        <h2 class="card-title">Your bookmarks</h2>
        <ul id="bookmark-list"></ul>
      </section>

    </main>
    <footer class="site-footer container">
      <p>© 2025 — Bookmarks Mini</p>
    </footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
